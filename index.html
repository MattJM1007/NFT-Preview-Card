<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="./styles.css" />

    <title>Frontend Mentor | NFT preview card component</title>
  </head>
  <body>
    <main>
      <div class="card">
        <img class="card__img" src="./images/image-equilibrium.jpg" alt="clear, redish cube sitting on one corner against a dark blue background" />

        <h1 class="card__title">Equilibrium #3429</h1>
        <p class="card__description">Our Equilibrium collection promotes balance and calm.</p>

        <div class="card__value flex">
          <div class="flex align-center">
            <img class="icon" src="./images/icon-ethereum.svg" alt="" />
            <span>0.041 ETH</span>
          </div>

          <div class="flex align-center">
            <img class="icon" src="./images/icon-clock.svg" alt="" />
            <span>3 days left</span>
          </div>
        </div>

        <div class="card__author flex align-center">
          <img class="profilepic" src="./images/image-avatar.png" alt="profile pic" />
          <p class="name">Creation of <span>Jules Wyvern</span></p>
        </div>
      </div>
    </main>

    <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. Coded by <a href="https://www.frontendmentor.io/profile/MattJM1007">Matthew Miguel</a>.
    </footer>
  </body>
</html>
